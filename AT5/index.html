<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário HTML e CSS</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Merriweather, sans-serif;
            padding: 20px;
        }

        form {
            width: 100%;
            max-width: 550px;
            margin: 30px auto;
            padding: 25px;
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 10px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 20px;
        }

        fieldset {
            border: 1px solid #444444;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        legend {
            color: #0d5794;
            padding: 0 10px;
            font-weight: bold;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 5px;
            background-color: #2d2d2d;
            color: #ffffff;
            border: 1px solid #555555;
            border-radius: 6px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
        }

        .inline-group {
            margin: 8px 0;
        }

        .inline-group label {
            display: inline;
            margin-right: 15px;
        }

        input:focus, select:focus, textarea:focus {
            background-color: #383838;
            border-color: #0d5794;
            outline: none;
        }

        input:invalid {
            border: 1px solid #ff5252;
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #0d5794;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>
    <form action="#" method="post" autocomplete="on">  
        <h2>Cadastro de Aluno</h2>

        <fieldset>
            <legend>Dados de Acesso</legend>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="usuarioNome" placeholder="Digite seu nome completo" required minlength="3">

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="usuarioEmail" placeholder="exemplo@email.com" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="usuarioSenha" required>
        </fieldset>

        <fieldset>
            <legend>Informações Acadêmicas</legend>

            <label for="nascimento">Data de Nascimento:</label>
            <input type="date" id="nascimento" name="usuarioNascimento" required>

            <label for="curso">Curso:</label>
            <select id="curso" name="usuarioCurso" required>
                <option value="" disabled selected>Selecione uma opção...</option>
                <option value="cc">Ciência da Computação</option>
                <option value="si">Sistemas de Informação</option>
                <option value="es">Engenharia de Software</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Perfil e Preferências</legend>

            <label>Sexo:</label>
            <div class="inline-group">
                <input type="radio" id="masc" name="usuarioSexo" value="masculino" required>
                <label for="masc">Masculino</label>
                
                <input type="radio" id="fem" name="usuarioSexo" value="feminino">
                <label for="fem">Feminino</label>
            </div>

            <label>Interesses:</label>
            <div class="inline-group">
                <input type="checkbox" id="int1" name="usuarioInteresses" value="programacao">
                <label for="int1">Programação</label>
                
                <input type="checkbox" id="int2" name="usuarioInteresses" value="web">
                <label for="int2">Desenvolvimento Web</label>
            </div>

            <label for="comentarios">Comentários:</label>
            <textarea id="comentarios" name="usuarioComentarios" rows="4" placeholder="Escreva suas observações..."></textarea>

            <label for="foto">Upload de foto:</label>
            <input type="file" id="foto" name="usuarioFoto">
        </fieldset>

        <button type="submit">Enviar Cadastro</button>

    </form>

</body>
</html>
